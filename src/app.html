<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PinNote</title>
    <script>
      // Apply the cached theme before first paint so no window flashes the wrong theme.
      try {
        var a = JSON.parse(localStorage.getItem("pinnote.appearance") || "{}"), r = document.documentElement;
        var m = a.theme || "system";
        var dark = m === "dark" || (m === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        r.dataset.theme = dark ? "dark" : "light"; r.style.colorScheme = dark ? "dark" : "light";
        if (a.reduceMotion || matchMedia("(prefers-reduced-motion: reduce)").matches) r.dataset.motion = "reduce";
        r.dataset.centerShadow = a.centerShadow || "standard"; r.dataset.noteShadow = a.noteShadow || "standard";
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
